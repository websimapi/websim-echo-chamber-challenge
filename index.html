<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Chamber Challenge</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Echo Chamber Challenge</h1>
        <div class="scoreboard">
            <div class="score">
                <span>User: </span><span id="userScore">0</span>
            </div>
            <div class="score">
                <span>LLM: </span><span id="llmScore">0</span>
            </div>
        </div>
        
        <div class="chat-container">
            <div id="chat-messages" class="chat-messages"></div>
            
            <div class="input-area">
                <textarea id="user-input" placeholder="Type your message here..." maxlength="32000"></textarea>
                <span class="char-counter"><span id="char-count">0</span>/32000</span>
                <button id="send-button">Send</button>
            </div>
        </div>
        
        <div class="rules">
            <h3>Rules:</h3>
            <p>The LLM must echo back exactly what you type. If it fails, you get a point. If it succeeds, it gets a point.</p>
        </div>
    </div>
    
    <script src="script.js"></script>

</html>
