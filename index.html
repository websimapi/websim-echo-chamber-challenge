<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Chamber Challenge</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Echo Chamber Challenge</h1>
        <div class="scoreboard">
            <div class="score">
                <span><i class="fas fa-user"></i> User: </span><span id="userScore">0</span>
            </div>
            <div class="score">
                <span><i class="fas fa-robot"></i> LLM: </span><span id="llmScore">0</span>
            </div>
        </div>
        
        <div class="chat-container">
            <div id="chat-messages" class="chat-messages"></div>
            
            <div class="input-area">
                <textarea id="user-input" placeholder="Type your message here..." maxlength="500"></textarea>
                <span class="char-counter"><span id="char-count">0</span>/500</span>
                <button id="send-button"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        
        <div class="diff-analysis-container">
            <div class="diff-analysis-header"><i class="fas fa-microscope"></i> Difference Analysis</div>
            <div id="diff-analysis-content" class="diff-analysis-content"></div>
        </div>
        
        <div class="rules">
            <h3><i class="fas fa-scroll"></i> Rules:</h3>
            <p>The LLM must echo back exactly what you type. If it fails, you get a point. If it succeeds, it gets a point. Try to trick the LLM by using special characters, unusual formatting, or other creative approaches!</p>
        </div>

        <div class="gallery-container">
            <h3><i class="fas fa-trophy"></i> Winners Gallery</h3>
            <div id="gallery-items" class="gallery-items"></div>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
